name: Test oauth-client-id, oauth-secret, and audience inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.94.2'
          use-cache: 'false'
          oauth-client-id: 'fake-oauth-client-id'
          oauth-secret: 'fake-oauth-secret'
          audience: 'fake-audience'
          tags: 'tag:ci'
      - name: Assert action ran with oauth and audience inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake OAuth credentials rejected by Tailscale)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

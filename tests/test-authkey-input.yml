name: Test authkey and tags inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          authkey: 'tskey-auth-fake-key-for-testing'
          tags: 'tag:ci,tag:test'
          version: '1.90.4'
          timeout: '10s'
          retry: '1'
      - name: Assert action ran with authkey and tags inputs (fails gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake authkey"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

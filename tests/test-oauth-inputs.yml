name: Test OAuth client inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          oauth-client-id: 'fake-oauth-client-id'
          oauth-secret: 'tskey-client-fake-secret-for-testing'
          tags: 'tag:ci,tag:test'
          version: '1.88.3'
          timeout: '10s'
          retry: '1'
      - name: Assert action ran with OAuth inputs (expected to fail without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real OAuth credentials present)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without real Tailscale OAuth credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

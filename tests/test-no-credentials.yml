name: Test no credentials (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.88.3'
          # No authkey or oauth credentials provided — action should fail gracefully
      - name: Assert action failed gracefully without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no credentials provided)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (credentials may have been injected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

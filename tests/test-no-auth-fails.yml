name: Test no auth fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.94.2'
          # No authkey, oauth-secret, or audience provided — should fail validation
      - name: Assert action failed with auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no auth is provided, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no authentication was provided"

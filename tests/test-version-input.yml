name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.88.3'
          # No credentials — action will fail after downloading/verifying the binary
      - name: Assert action ran (version input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without credentials the action is expected to fail, but it should not
          # error out before even starting (e.g. due to an invalid version string).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at auth stage as expected (no credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

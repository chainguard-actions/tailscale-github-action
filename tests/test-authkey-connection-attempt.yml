name: Test authkey passes validation but fails on connection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.94.2'
          authkey: 'tskey-auth-fake000000000000-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          use-cache: 'false'
          timeout: '10s'
          retry: '1'
      - name: Assert action ran and failed gracefully (invalid authkey)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the authkey is invalid (not a validation error,
          # but a connection error after installation). Either way it should not succeed.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with a fake authkey"
            exit 1
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid authkey (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

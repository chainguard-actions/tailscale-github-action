name: Test custom version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.80.0'
          # No credentials — action will fail, but we verify it accepts the version input
      - name: Assert action ran (failed on credentials, not on version input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to missing credentials, not due to an invalid version.
          # A failure here is expected and acceptable — it means the version input was parsed.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (credentials missing, version input accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

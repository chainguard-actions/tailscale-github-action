name: Test OIDC federated identity requires version 1.90.0+
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.80.0'
          oauth-client-id: 'fake-client-id'
          audience: 'fake-audience'
          tags: 'tag:ci'
          # Using audience (OIDC) with version < 1.90.0 should fail validation
      - name: Assert action failed due to version too old for OIDC
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using OIDC with version < 1.90.0, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC was used with a version older than 1.90.0"

name: Test missing auth credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.94.2'
          # No authkey, oauth-client-id, oauth-secret, or audience provided
      - name: Assert action failed with missing auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no auth credentials are provided, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no auth credentials were provided"

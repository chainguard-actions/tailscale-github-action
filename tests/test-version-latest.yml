name: Test version latest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'latest'
          # No credentials — action will fail at auth stage but should accept 'latest'
      - name: Assert action ran with latest version specifier
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at auth stage as expected (no credentials, version=latest accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with version=latest"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

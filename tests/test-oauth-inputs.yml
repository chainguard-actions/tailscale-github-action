name: Test OAuth and audience inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          oauth-client-id: 'fake-oauth-client-id'
          oauth-secret: 'fake-oauth-secret'
          audience: 'fake-audience'
          tags: 'tag:ci'
          version: '1.90.4'
          timeout: '10s'
          retry: '1'
      - name: Assert action ran (oauth-client-id, oauth-secret, audience inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with OAuth inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake OAuth credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

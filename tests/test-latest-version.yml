name: Test latest version keyword
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 'latest'
          use-cache: 'false'
      - name: Assert action ran with latest version (failed gracefully without credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no credentials provided)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with latest version"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

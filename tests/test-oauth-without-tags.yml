name: Test OAuth secret without tags fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.94.2'
          oauth-client-id: 'fake-client-id'
          oauth-secret: 'fake-oauth-secret'
          # tags intentionally omitted — should trigger validation error
      - name: Assert action failed due to missing tags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when oauth-secret is provided without tags, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when oauth-secret was provided without tags"

name: Test use-cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '1.88.3'
          use-cache: 'false'
          # No credentials — action will fail at auth stage
      - name: Assert action ran with cache disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at auth stage as expected (no credentials, use-cache=false accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with use-cache=false"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test version input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Specify a particular version — action should attempt to use it
          version: '1.90.4'
          # No auth credentials — action will fail on auth, not on version parsing
      - name: Assert action ran (failed on auth, not on version input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because no credentials were provided,
          # not because of an invalid version input.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (auth missing, version input accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
